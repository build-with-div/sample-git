[package]
name = "sample-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "A small local git client built on Div (sample app)"
license = "Apache-2.0"

[[bin]]
name = "sample-git"
path = "src/main.rs"

# Div is pinned to one commit. Bump `rev` here and in the patch table below
# together, deliberately, when a framework fix this app needs lands.
[dependencies]
divui = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b", features = ["desktop", "menu", "dialog"] }
div-components = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b" }

[dev-dependencies]
divui = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b", features = ["testing"] }

# The framework's dependency patches, which Cargo does not apply to
# dependents. Keep them equal to the pinned Div workspace's.
[patch.crates-io]
skia-safe = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skia-bindings = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skrifa = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b" }
read-fonts = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b" }
font-types = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b" }
bytemuck = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b" }
bytemuck_derive = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b" }
zbus_xml = { git = "https://github.com/build-with-div/div", rev = "03573e7db3d160699058e8bdf121f41856143a0b" }

# Fast incremental builds: the app stays unoptimized while the framework it
# depends on runs optimized.
[profile.dev.package."*"]
opt-level = 2

# On Linux, rust-skia compiles Skia at this package's opt-level, which is
# part of the rendering configuration. Keep it equal in every profile.
[profile.dev.package.skia-bindings]
opt-level = 3

[profile.release.package.skia-bindings]
opt-level = 3
